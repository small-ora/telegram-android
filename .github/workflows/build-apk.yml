name: Build signed APK

# 触发方式：
# 1) 推送 v* 标签（如 v13.1.1）→ 构建并自动创建 GitHub Release，上传 APK；
# 2) 手动 Actions → Run workflow → 仅构建，产物在 run 的 Artifacts 里（不建 Release）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本标签（可选，例如 v13.1.1；留空则只构建 artifact）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator || true
          sudo apt-get clean
          df -h /

      - name: 检出源码与子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 组件
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          df -h /

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建 release APK（afat / arm64-v8a，可正常安装）
        run: |
          set -o pipefail
          # 注意：-Pandroid.injected.build.abi 是 AGP 的 IDE 注入参数，副作用是给 APK 打上
          # android:testOnly=true；手机系统安装器会拒装（只提示"安装失败/应用未安装"，无详情）。
          # 必须显式 -Pandroid.injected.testOnly=false 关闭（实测：清单与不注入时逐字节一致）。
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            -Dorg.gradle.jvmargs=-Xmx4g \
            --max-workers=4 --console=plain --no-daemon 2>&1 | tee build.log

      - name: 校验产物（签名 / 版本 / 非 testOnly）并计算校验和
        id: apk
        run: |
          # 只取 afat 风味（versionCode = 版本号×10+9），避免误选 bundleAfat（×10+1）造成降级安装失败
          APK="$(find TMessagesProj_App/build/outputs/apk -path '*afat/release/*.apk' | sort | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find TMessagesProj_App/build/outputs/apk -name '*.apk' -path '*release*' | sort | head -1)"
          fi
          if [ -z "$APK" ]; then
            echo "❌ 未找到 release APK"
            exit 1
          fi
          echo "APK=$APK"

          BT="$ANDROID_HOME/build-tools/36.0.0"

          # 门禁 1：APK 不能带 android:testOnly="true"，否则手机端点击安装会直接失败
          # （只匹配值为 true；显式 testOnly=false 时该属性不存在或为 false，不应误拦）
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -qE 'testOnly\(0x[0-9a-f]+\)=true'; then
            echo "❌ APK 被标记为 android:testOnly=true，手机端将无法安装（检查 -Pandroid.injected.testOnly=false）"
            exit 1
          fi
          echo "✅ 清单无 testOnly，可正常安装"

          # 门禁 2：签名有效，且必须是历史 Release 使用的同一张证书（否则老用户无法覆盖升级）
          EXPECTED_CERT="a08d7dc323ddf71ef3201944397e0d3cce7d40847263e11f328b68bbe19229ab"
          CERTS="$("$BT/apksigner" verify --print-certs "$APK")"
          echo "$CERTS" | grep -E 'Signer #1 certificate (DN|SHA-256 digest)'
          if ! echo "$CERTS" | grep -Fq "SHA-256 digest: $EXPECTED_CERT"; then
            echo "❌ 签名证书与历史 Release 不一致（期望 SHA-256 $EXPECTED_CERT），覆盖升级会失败"
            exit 1
          fi
          echo "✅ 签名证书与历史 Release 一致"

          VER="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          CODE="$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)"
          EXPECT_CODE=$((CODE * 10 + 9))   # afat 风味的 versionCode
          BADGING="$("$BT/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code"
          if ! echo "$BADGING" | grep -q "versionCode='$EXPECT_CODE'"; then
            echo "❌ versionCode 不是预期的 $EXPECT_CODE（可能选错风味或版本号）"
            exit 1
          fi

          NAME="tg-client-${VER}-${CODE}-arm64-release.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            *.apk
            *.apk.sha256
          if-no-files-found: error

      - name: 创建 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.apk }}
          VER: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          ## Telegram Android ${VER} (${CODE}) — 自用版

          基于官方源码 ${VER}，保留两处改动：

          - 🔐 **扫码登录**：新设备登录页「通过二维码登录」，用已登录的手机扫码确认，无需短信验证码；
          - 🚫 **去除广告**：频道/Bot 赞助消息、搜索推荐频道、视频/图片贴片广告。

          安装包：\`${APK}\`

          ### 安装说明

          - 包名 \`org.telegram.messenger\`，与官方版冲突：首次安装需先卸载官方 Telegram（数据在云端，不丢）；
          - 与历史 Release 使用同一签名（仓库自带 keystore），可直接覆盖升级；
          - 主库仅含 arm64-v8a（现代 Android 手机）；
          - 校验：\`sha256sum ${APK}\`（见同名 .sha256 文件）。

          > ⚠️ v13.1.1 / v13.2.1 的 Release APK 曾被 AGP 注入构建参数标记为 \`android:testOnly=true\`，
          > 在手机上直接点击安装会失败（只提示"安装失败/应用未安装"，无详情）；从本版本起该问题已修复，
          > 可直接下载安装。旧版本仍保留在 Release 列表中，但只能通过 \`adb install -t\` 安装。
          >
          > 非官方客户端，与 Telegram 官方无关联；源码以 GPLv2 发布，见仓库 LICENSE。
          EOF
          sed -i 's/^ *//' release-notes.md   # 去掉 YAML 块缩进，避免 Markdown 被当成代码块
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "Telegram ${VER} 自用版（扫码登录 + 去广告）" \
            --notes-file release-notes.md
